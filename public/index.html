<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="src/styles.css?v=20260601-practice">
</head>
<body>
    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
        <div id="sidebar-header">
            <div class="file-icon"></div>
            <span class="file-name">Loading accounting data...</span>
            <div class="view-tabs" aria-label="Accounting views">
                <button id="quiz-view-button" class="view-tab active" type="button">Quiz</button>
                <button id="mindmap-view-button" class="view-tab" type="button">Mindmap</button>
                <button id="practice-view-button" class="view-tab" type="button">Practice</button>
            </div>
        </div>
        <div id="sidebar-content">
            <div class="empty-state">Hover over a node to see its hierarchy</div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="tree-panel">
        <div id="tree-container"></div>
        <div id="route-bar"></div>
        <div class="controls">
            <button id="accounting-button" type="button">Accounting</button>
            <button id="collapse-button" type="button">Collapse All</button>
            <button id="reset-button" type="button">Reset View</button>
            <button id="clear-button" type="button">Clear</button>
        </div>
    </div>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <script src="src/app.js?v=20260601-practice"></script>
</body>
</html>
